name: Refresh Global CTF Observatory data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch public CTFtime event feed
        run: |
          mkdir -p data
          python - <<'PY'
          import json, time, urllib.request, datetime
          now = int(time.time())
          start = now - 7 * 86400
          url = f"https://ctftime.org/api/v1/events/?limit=100&start={start}"
          req = urllib.request.Request(url, headers={"User-Agent":"CyberRiskObserver/1.0 (public CTF observatory)"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = json.load(response)
          except Exception as exc:
              print(f"Feed retrieval failed: {exc}")
              raise
          events = []
          for e in raw:
              events.append({
                  "title": e.get("title"),
                  "start": e.get("start"),
                  "finish": e.get("finish"),
                  "url": e.get("ctftime_url") or e.get("url"),
                  "format": e.get("format") or "Other",
                  "organizers": [o.get("name", str(o)) if isinstance(o, dict) else str(o) for o in e.get("organizers", [])]
              })
          payload = {
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": "CTFtime public API",
              "events": events,
              "teams": []
          }
          with open("data/ctf-observatory.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          print(f"Saved {len(events)} events")
          PY
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ctf-observatory.json
          git diff --cached --quiet || git commit -m "chore: refresh global CTF observatory data"
          git push
